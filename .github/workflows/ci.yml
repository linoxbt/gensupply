name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the GenVM linter and test SDK
        run: |
          python -m pip install --upgrade pip
          pip install genlayer-py genlayer-test pytest
      - name: Lint the contract
        run: pipx run --spec genvm-linter genvm-lint check contracts/gensupply.py
      - name: Merkle vectors are reproducible
        run: |
          python fixtures/make_merkle_vectors.py
          git diff --exit-code fixtures/merkle-vectors.json
      - name: Direct-mode (real GenVM SDK) and in-process suites
        run: python -m pytest -q

  agent:
    name: Device agent — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The tested modules (merkle, txstatus, sensor, pinata) have no dependencies.
      - run: node --test agent/test/*.test.mjs

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_GENSUPPLY_ADDRESS: "0x349892c5FF0582Bc63daBe61eac6d7bfBC267aA8"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
